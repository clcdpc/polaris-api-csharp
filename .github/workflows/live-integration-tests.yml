name: Live Polaris Integration Tests

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  live-integration-tests:
    name: Live integration tests
    runs-on: ubuntu-latest
    environment: disposable-polaris-integration

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Write local integration settings
        env:
          APPSETTINGS_TEST_JSON: ${{ secrets.APPSETTINGS_TEST_JSON }}
        run: |
          if [[ -z "${APPSETTINGS_TEST_JSON}" ]]; then
            echo "APPSETTINGS_TEST_JSON secret must contain src/polaris-api-csharpTests/appsettings.Test.json content." >&2
            exit 1
          fi
          printf '%s' "${APPSETTINGS_TEST_JSON}" > src/polaris-api-csharpTests/appsettings.Test.json

      - name: Restore tests
        run: dotnet restore src/polaris-api-csharpTests/Clc.Polaris.Api.Tests.csproj

      - name: Build tests
        run: dotnet build src/polaris-api-csharpTests/Clc.Polaris.Api.Tests.csproj --configuration Release --no-restore -warnaserror

      - name: Run live integration tests
        run: dotnet test src/polaris-api-csharpTests/Clc.Polaris.Api.Tests.csproj --configuration Release --no-build --filter "TestCategory=ReadOnlyIntegration|TestCategory=ProtectedReadOnlyIntegration|TestCategory=MutatingIntegration|TestCategory=ProtectedMutatingIntegration" --logger trx --results-directory TestResults

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-test-results
          path: TestResults/**/*.trx
